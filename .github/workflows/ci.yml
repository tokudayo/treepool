name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: CLI smoke test
        run: |
          swift build --product twt
          scripts/smoke-test.sh .build/debug/twt

      - run: swift build -c release --product TreepoolMenu
      - run: scripts/package-dmg.sh .build/release/TreepoolMenu
      - name: Verify packaged app
        run: |
          mount="$(mktemp -d)"
          hdiutil attach dist/*.dmg -nobrowse -readonly -mountpoint "$mount"
          trap 'hdiutil detach "$mount"; rmdir "$mount"' EXIT
          test ! -e "$mount/Install.txt"
          test -f "$mount/.DS_Store"
          test -f "$mount/.background.png"
          codesign --verify --strict "$mount/Treepool.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$mount/Treepool.app/Contents/Info.plist")" = "$(cat VERSION)"
          test "$(readlink "$mount/Applications")" = /Applications
          test -f "$mount/Treepool.app/Contents/Resources/Treepool-symbol-on-dark.png"
          test -f "$mount/Treepool.app/Contents/Resources/Treepool-symbol-on-light.png"
          lipo "$mount/Treepool.app/Contents/MacOS/TreepoolMenu" -verify_arch arm64

  linux:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image:
          - swift:6.3.3-jammy
          - swift:6.3.3-bookworm
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: CLI smoke test
        run: |
          swift build --product twt
          scripts/smoke-test.sh .build/debug/twt
